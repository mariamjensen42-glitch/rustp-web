[package]
name = "blog-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.7.0"
actix-rt = "2.9.0"
actix-multipart = "0.7.0"
diesel = { version = "2.1.0", features = ["sqlite", "chrono"] }
diesel_migrations = "2.1.0"
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
dotenv = "0.15.0"
chrono = { version = "0.4.38", features = ["serde"] }
jsonwebtoken = "9.3.0"
bcrypt = "0.15.0"
actix-cors = "0.7.0"
validator = { version = "0.16.0", features = ["derive"] }
futures = "0.3.30"
lettre = { version = "0.10.0", features = ["smtp-transport", "tokio1", "tokio1-native-tls", "builder"] }
handlebars = "4.5.0"
