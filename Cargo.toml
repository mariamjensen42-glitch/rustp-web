[package]
name = "blog-api"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.7.0"
actix-rt = "2.9.0"
diesel = { version = "2.1.0", features = ["sqlite"] }
diesel_migrations = "2.1.0"
tokio = { version = "1.37.0", features = ["full"] }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
dotenv = "0.15.0"
